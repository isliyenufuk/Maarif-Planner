<!DOCTYPE html>
<html lang="tr" data-t="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070B19">
<title>Maarif Planner</title>
<style>
:root{--bg:#070B19;--s1:rgba(255,255,255,.07);--s2:rgba(255,255,255,.13);--solid:#0e1432;--glass:rgba(10,15,44,.66);--tx:#fff;--mu:rgba(235,235,245,.62);--ac:#0A84FF;--acx:#fff;--ln:rgba(255,255,255,.12);--r:24px;color-scheme:dark}
:root[data-t=light]{--bg:#fff;--s1:#f2f2f7;--s2:#e5e5ea;--solid:#f2f2f7;--glass:rgba(255,255,255,.76);--tx:#000;--mu:#6c6c70;--ac:#007AFF;--acx:#fff;--ln:rgba(60,60,67,.16);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;transition:background .3s,color .3s}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
#top{position:fixed;inset:0 0 auto 0;height:calc(68px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;display:flex;align-items:center;justify-content:space-between;background:var(--bg);z-index:20;border-bottom:1px solid var(--ln)}
#top b{font-size:20px;letter-spacing:.2px}
.ib{width:52px;height:52px;border-radius:16px;background:var(--s1);display:grid;place-items:center}
.ib svg{width:26px;height:26px}
#lg img{width:52px;height:52px;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
body.login #lg{visibility:hidden}
#app{position:fixed;inset:calc(68px + env(safe-area-inset-top)) 0 0 0;overflow:auto;padding:22px 24px 40px;-webkit-overflow-scrolling:touch}
.wrap{max-width:1000px;margin:0 auto}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.ph h1{flex:1;font-size:30px;margin:0}
.bk{width:48px;height:48px;border-radius:16px;background:var(--s1);display:grid;place-items:center}
.bk svg{width:22px;height:22px;transform:rotate(180deg)}
.big{display:flex;align-items:center;gap:20px;width:100%;min-height:112px;padding:22px 28px;margin-bottom:16px;border-radius:var(--r);background:var(--s1);text-align:left;font-size:30px;font-weight:800;transition:transform .15s}
.big:active,.card:active{transform:scale(.97)}
.big small{display:block;font-size:16px;font-weight:500;color:var(--mu);margin-top:4px}
.big .ic{width:64px;height:64px;border-radius:20px;background:var(--ac);color:var(--acx);display:grid;place-items:center;font-size:20px;flex:none}
.big .ic svg{width:34px;height:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--s1);border-radius:var(--r);padding:22px;font-size:21px;font-weight:700;text-align:left;transition:transform .15s}
.card small{display:block;color:var(--mu);font-weight:500;font-size:15px;margin:6px 0 12px}
.bar{height:10px;border-radius:9px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .4s}
.row{display:flex;align-items:center;gap:16px;min-height:68px;padding:12px 20px;margin-bottom:10px;border-radius:20px;background:var(--s1);font-size:19px}
.row span{flex:1}
.row.done span{opacity:.55;text-decoration:line-through}
.ck,.ci{width:36px;height:36px;border-radius:50%;border:3px solid var(--mu);flex:none;display:grid;place-items:center}
.on>.ck,.on>.ci{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.ck svg,.ci svg{width:20px;height:20px;opacity:0}.on>.ck svg,.on>.ci svg{opacity:1}
.sum{background:var(--s1);border-radius:var(--r);padding:22px;margin-bottom:18px;font-size:18px;display:flex;flex-direction:column;gap:12px}
.btn{min-height:60px;padding:0 30px;border-radius:20px;background:var(--ac);color:var(--acx);font-weight:800;font-size:19px}
.btn2{min-height:60px;padding:0 30px;border-radius:20px;background:var(--s2);font-weight:700;font-size:18px}
.btn:disabled{opacity:.35}
.add{display:flex;gap:12px;margin-top:16px}
input[type=text],input[type=email],input[type=date]{width:100%;min-height:56px;padding:0 18px;border-radius:18px;border:2px solid var(--ln);background:var(--s1);outline:0;font-size:18px}
input:focus{border-color:var(--ac)}
.mu{color:var(--mu)}
.pc{display:flex;align-items:center;gap:14px;padding:22px 26px;margin-bottom:14px;border-radius:var(--r);background:var(--s1)}
.pc .t{flex:1;font-size:22px;font-weight:700;text-align:left}
.pc .t small{display:block;font-size:14px;color:var(--mu);font-weight:500}
.ib2{width:54px;height:54px;border-radius:16px;background:var(--s2);display:grid;place-items:center}
.ib2 svg{width:24px;height:24px}
.login{display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:100%;text-align:center;padding:10px 0 30px}
.login .lgo img{width:132px;height:132px;display:block;margin:0 auto}
.login h2{margin:10px 0 0;font-size:22px;letter-spacing:.5px}
.login .tooth{width:230px;height:230px;border-radius:50%;background:var(--s1);display:grid;place-items:center;margin:10px auto}
.tooth svg{width:130px;height:130px}
.login h3{font-size:30px;margin:0}
.login .btn{width:min(440px,90%);min-height:72px;font-size:23px;border-radius:26px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center}
.mo>div{background:var(--bg);border:1px solid var(--ln);border-radius:28px;padding:28px;width:min(440px,92%)}
.mo h2{margin:0 0 8px}.bt{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
#dr{position:fixed;top:0;bottom:0;left:0;width:min(400px,88%);background:var(--bg);border-right:1px solid var(--ln);z-index:40;transform:translateX(-105%);transition:transform .3s;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 20px 30px}
#dr.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.45)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35;display:none}#sh.open{display:block}
#dr h4{margin:22px 4px 10px;color:var(--mu);font-size:15px;font-weight:600}
.set{display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:0 20px;border-radius:20px;background:var(--s1);margin-bottom:10px;width:100%;font-size:18px;font-weight:600}
.sw{width:64px;height:36px;border-radius:20px;background:var(--s2);position:relative;transition:.3s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.3s}
.sw.on{background:var(--ac)}.sw.on::after{left:32px}
#dr label{display:block;font-size:14px;color:var(--mu);margin:10px 4px 6px}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,100px);background:var(--ac);color:var(--acx);padding:14px 26px;border-radius:30px;font-weight:700;z-index:60;transition:.3s}
#toast.show{transform:translate(-50%,0)}
.tb{display:none;align-items:center;gap:12px;padding:12px 16px;border-radius:20px;background:var(--s1);margin-bottom:12px;flex-wrap:wrap}
.tb.on{display:flex}
.sc{width:44px;height:44px;border-radius:50%;border:3px solid var(--ln)}
.gw{overflow:auto;border-radius:var(--r);background:var(--s1);height:calc(100vh - 290px);min-height:300px}
table.g{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:980px;width:100%}
.g th{position:sticky;top:0;background:var(--s2);z-index:3;height:46px;font-size:15px}
.g th.hr{left:0;top:auto;width:68px;z-index:2;height:56px;font-size:13px;color:var(--mu);vertical-align:top;padding-top:6px;background:var(--s1)}
.g thead th.hr{top:0;z-index:4;background:var(--s2)}
.g td{height:56px;border-top:1px solid var(--ln);border-left:1px solid var(--ln);padding:0;position:relative}
.cell{position:absolute;inset:2px;border-radius:12px;background:var(--s2);padding:6px 8px}
.cell.sel{outline:3px solid var(--ac)}
.ct{height:100%;overflow:hidden;outline:0;font-size:14px;line-height:1.25;word-break:break-word}
.hd{display:none;position:absolute;left:50%;width:46px;height:22px;margin-left:-23px;border-radius:11px;background:var(--ac);touch-action:none;z-index:5;top:-12px}
.hd.b{top:auto;bottom:-12px}
.cell.sel.has .hd{display:block}
</style>
<style>
html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body{background:radial-gradient(900px 520px at 85% -8%,rgba(10,132,255,.20),transparent 60%),radial-gradient(760px 520px at -10% 105%,rgba(94,92,230,.16),transparent 60%),var(--bg);background-attachment:fixed}
:root[data-t=light] body{background:var(--bg)}
#top,#dr,#dt{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.big,.card,.row,.pc,.sum,.set,.si,.ib,.bk,.ib2,.btn2{-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--ln)}
.big,.card,.pc,.sum{border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
:root[data-t=light] .big,:root[data-t=light] .card,:root[data-t=light] .pc,:root[data-t=light] .sum{box-shadow:0 6px 20px rgba(0,0,0,.07)}
.row{border-radius:20px}.ib,.bk,.ib2{border-radius:50%}
.big .ic{background:linear-gradient(135deg,#0A84FF,#5E5CE6);color:#fff;border-radius:18px;box-shadow:0 6px 16px rgba(10,132,255,.4)}
.ph h1{font-size:34px;font-weight:700;letter-spacing:-.02em}
.btn{border-radius:999px;color:#fff;background:linear-gradient(180deg,#2f95ff,#0A84FF);box-shadow:0 8px 22px rgba(10,132,255,.4)}
.btn2{border-radius:999px}
.g th,.g th.hr,.g thead th.hr{background:var(--solid)}.gw{border:1px solid var(--ln)}
#top b{font-weight:600}
.login{padding:6px 0 28px}
.hero{display:flex;flex-direction:column;align-items:center;gap:26px}
.tdraw{width:min(300px,50vw);height:auto;filter:drop-shadow(0 0 30px rgba(10,132,255,.5))}
.tdraw .m{fill:none;stroke:var(--tx);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.8s ease forwards}
.tdraw .m2{stroke:#0A84FF;opacity:.75;animation-delay:.25s}
@keyframes dr{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.tdraw .m{animation:none;stroke-dashoffset:0}}
.login h3{font-size:36px;font-weight:700;letter-spacing:-.02em;margin:0}
.login .btn{width:min(440px,90%);min-height:68px;font-size:21px;border-radius:999px}
#dr{width:min(360px,88%)}
#dt{position:fixed;top:0;bottom:0;left:min(360px,88%);right:0;z-index:41;padding:calc(20px + env(safe-area-inset-top)) 28px 30px;overflow:auto;transform:translateX(104%);transition:transform .32s cubic-bezier(.2,.8,.2,1);border-left:1px solid var(--ln)}
#dt.open{transform:none}
@media(max-width:700px){#dt{left:0}.dbk{display:grid!important}}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:18px}.dh h2{margin:0;font-size:30px;flex:1;letter-spacing:-.02em}.dbk{display:none}
.si{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:0 16px;margin-bottom:10px;border-radius:20px;background:var(--s1);font-size:18px;font-weight:600;text-align:left}
.si span{flex:1}.si em{color:var(--mu);font-style:normal;font-size:24px}.si.on{background:var(--s2)}
.sic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}.sic svg{width:22px;height:22px}
.sic.theme{background:#5E5CE6}.sic.profile{background:#0A84FF}.sic.lang{background:#30D158}.sic.trash{background:#FF9F0A}.sic.exit{background:#FF453A}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.seg button{min-height:110px;border-radius:24px;background:var(--s1);border:2px solid var(--ln);font-size:20px;font-weight:700}
.seg small{display:block;color:var(--mu);font-weight:500;font-size:14px;margin-top:4px}.seg .on{border-color:var(--ac)}
.fl{display:block;font-size:14px;color:var(--mu);margin:14px 4px 6px}
.hd.l,.hd.r{top:50%;width:22px;height:46px;margin:-23px 0 0}.hd.l{left:-12px}.hd.r{left:auto;right:-12px}
.hd::after{content:"";position:absolute;inset:-12px}
</style>
</head>

<div class="bt" style="justify-content:stretch"><button class="btn" data-a="rs" ${n?'':'disabled'} style="flex:1">Geri Yükle</button><button class="btn2" data-a="pg" ${n?'':'disabled'} style="flex:1;opacity:${n?1:.4}">Sil (Kalıcı)</button></div></div>`}};
function draw(keep){const a=$('#app'),y=a.scrollTop,r=cur();document.body.classList.toggle('login',r.v=='login');a.innerHTML=V[r.v](r.p);if(keep)a.scrollTop=y;else a.scrollTop=0;if(r.v=='plan'){grid();$('#gw').scrollTop=7*56}}

for(let h=0;h<24;h++){r+=`<tr><th class="hr">${p2(h)}:00</th>`;
for(let d=0;d<7;d++){const v=cv[d+'_'+h];if(v===-1)continue;

else{const c=p.cells[v];r+=`<td rowspan="${c.s}" colspan="${c.w||1}"><div class="cell${v===sel?' sel':''}${c.t.trim()?' has':''}" data-a="sel" data-i="${v}" style="${c.c?`background:${c.c};color:#fff`:''}"><div class="ct" contenteditable="plaintext-only" data-i="${v}">${esc(c.t)}</div><i class="hd" data-s="t" data-i="${v}"></i><i class="hd b" data-s="b" data-i="${v}"></i><i class="hd l" data-s="l" data-i="${v}"></i><i class="hd r" data-s="r" data-i="${v}"></i></div></td>`}}
r+='</tr>'}
gw.innerHTML=r+'</tbody></table>';gw.scrollTop=sy;gw.scrollLeft=sx}
function setSel(i){sel=i;document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('sel',+c.dataset.i===i));$('#tb')&&$('#tb').classList.toggle('on',i!=null)}
/* Ayarlar */
const SI=[['theme','Tema','sun'],['profile','Profil','user'],['lang','Dil','globe'],['trash','Çöp Kutusu','bin'],['exit','Çıkış Yap','out']];
